name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & Build
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run lint

      - name: Build production bundle
        run: npm run build
